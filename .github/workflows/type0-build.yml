      - name: Clone official PPSSPP and its native dependencies
        shell: bash
        run: |
          git clone --recurse-submodules --shallow-submodules --depth=200 https://github.com/hrydgard/ppsspp.git ppsspp
          test -f ppsspp/android/build.gradle.kts
          test -f ppsspp/android/src/org/ppsspp/ppsspp/PpssppActivity.java

      - name: Patch APK with dedicated FF Type-0 launcher
        shell: bash
        run: python3 type0/apply_to_ppsspp.py ppsspp

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build ARM64 APK with native PSP engine
        working-directory: ppsspp
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleNormalOptimized --stacktrace --no-daemon

      - name: Inspect generated APK and copy artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find ppsspp/android/build/outputs/apk -type f -name '*.apk' | grep -i normal | grep -i optimized | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/[^ ]+\.so'
          mkdir -p output
          cp "$APK" output/FFType0_EngineTest_ARM64.apk
          sha256sum output/FFType0_EngineTest_ARM64.apk > output/SHA256.txt

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: FFType0-Engine-Test-APK
          path: output/
          if-no-files-found: error
          
